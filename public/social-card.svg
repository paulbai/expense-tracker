      <stop offset="0" stop-color="#171b32"/>
      <stop offset="0.55" stop-color="#352464"/>
      <stop offset="1" stop-color="#8f326d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
